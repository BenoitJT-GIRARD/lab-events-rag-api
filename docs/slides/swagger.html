<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Swagger UI — Puls Events RAG</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; font-family: sans-serif; }
    header {
      background: #16213e;
      color: #e0e0e0;
      padding: 8px 16px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #0f3460;
    }
    header span { color: #a0aec0; }
    header a {
      color: #63b3ed;
      text-decoration: none;
      font-size: 12px;
    }
    header a:hover { text-decoration: underline; }
    iframe {
      display: block;
      width: 100%;
      height: calc(100vh - 36px);
      border: none;
    }
  </style>
</head>
<body>
  <header>
    <strong>Puls Events RAG</strong>
    <span>|</span>
    <span>API : <a href="http://127.0.0.1:8000/docs" target="_blank">http://127.0.0.1:8000/docs</a></span>
    <span style="margin-left:auto; font-size:11px; color:#718096;">L'API doit tourner localement</span>
  </header>
  <iframe src="http://127.0.0.1:8000/docs" title="Swagger UI"></iframe>
</body>
</html>
